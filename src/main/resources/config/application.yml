debug: false

# ======================================
# === NumaHOP Specific configuration ===
# ======================================
# These are configuration keys defined and used only by NumaHOP itself.
# See: https://numahop.github.io/Documentation/developper_manual/install/config.html
# TODO: Create a namespace for all the configuration keys specific to numahop.
# For example:
# ```yaml
# numahop:
#   security.remembermekey:
#   services:
#       ...
#   base-path: /opt/pgcn
# ```

# Security configuration.
# This key should be unique for your application, and kept secret.
admin:
    login: admin
    # This key is generated using bcrypt and should be kept secret.
    # It must be changed for installations.
    #   default value : password
    password: $2a$10$xsRQ/2khgr0sblEfy6SjTujCnI3jGxj6q.yNQkKKaz4.ZIsuBT05O

async:
    corePoolSize: 2
    maxPoolSize: 10
    queueCapacity: 10000

base-path: /opt/pgcn

cron:
    cinesExport: 0 30 1 * * ?
    cinesUpdateStatus: 0 10 * * * *
    cleanExportCaches: 0 30 6 * * ?
    cleanDeliveryFiles: 0 0 1 * * ?
    cleanLocks: 0 30 0 * * *
    cleanTemporaryFiles: 0 0 2 * * ?
    digitalLibraryExport: 0 0 3 * * ?
    docUnitUpdateArk: 0 0 6 * * ?
    gestDeliveredFiles: 0 00 18 * * SAT
    internetArchiveExport: 0 26 17 * * ?
    localExport: 0 0 4 * * ?
    omekaExport: 0 0 3 * * ?
    rebuildIndex: 0 40 0 * * *
    removeOldTokens: 0 0 0 * * ?

elasticsearch:
    bulk_size: 500
    index:
        name: pgcn
        separator: '-'

export:
    rdf:
        default_uri: http://numahop.fr/
    ssh:
        knownHosts: ${base-path}/config/known_hosts
        strictHostKeyChecking: 'no'
    sftp:
        privateKey: ${base-path}/config/id_rsa

# Information about the build.
info:
    app:
        name: '@project.name@'
        description: '@project.description@'
        version: '@git.commit.id.describe@'
    build:
        artifact: '@project.artifactId@'
        name: '@project.name@'
        description: '@project.description@'
        version: '@project.version@'

instance:
    libraries: library_bibliotheque
    # library_identifier1, library_identifier2, etc..

images:
    format:
        default:
            thumbWidth: 150
            thumbHeight: 150
            viewWidth: 982
            viewHeight: 1417
            printWidth: 1964
            printHeight: 2835

jhipster.security.rememberme.key: $$$$_!!change_me!!_$$$$

messaging:
    template:
        path: ${base-path}/Messaging/MessagingTemplate

report:
    imagePath: images

services:
    cines:
        updating:
            cronenabled: false
        aip: ${base-path}/cines/aip
        cache: ${base-path}/cines/cache
        facile: https://facile.cines.fr/xml
        xsd:
            sip: ${base-path}/xsd/sip.xsd
    archive:
        s3-url: https://s3.us.archive.org
        alto: ${base-path}/archive/alto
        text: ${base-path}/archive/text
    metaDatas:
        path: ${base-path}/metadatas
    deliveryreporting:
        path: ${base-path}/deliveryReporting
    omeka:
        cache: ${base-path}/omeka/cache
    ftpexport:
        cache: ${base-path}/ftpexport/cache
    digitalLibraryDiffusion:
        cache: ${base-path}/digitalLibraryDiffusion/cache

sshForwarding:
    enabled: false
    server:
    user:
    password:
    port: 22
    knownHosts: ${base-path}/config/known_hosts
    strictHostKeyChecking: yes
    database:
        remoteServer: localhost
        localPort: 3306
        remotePort: 3306
    elasticsearch:
        remoteServer: localhost
        localPort: 9300
        remotePort: 9300

storage:
    binaries: ${base-path}/dam
    digest: MD5
    depth: 3

uploadPath:
    condition_report: ${base-path}/upload/condition_report
    ead: ${base-path}/upload/ead
    import: ${base-path}/upload/import
    library: ${base-path}/upload/library
    user: ${base-path}/upload/user
    template: ${base-path}/upload/templates

# ==========================================
# === Spring Boot Specific configuration ===
# ==========================================
# These are configuration keys defined by spring boot.
# See: https://docs.spring.io/spring-boot/appendix/application-properties/index.html

cache: # Cache configuration
    ehcache: # Ehcache configuration
        time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
        max-entries: 1000 # Number of objects in each cache entry

# This is numahop specific but will be replaced when upgrading to spring boot v3.5
# It was implemented for supporting structured logging (JSON formated logs).
logging:
    level.root: INFO
    level:
        fr.progilone.pgcn: DEBUG
        org.springframework.scheduling.support.TaskUtils.LoggingErrorHandler: OFF
        org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: WARN
        org.springframework.boot.actuate.endpoint.web.servlet.WebMvcEndpointHandlerMapping: WARN
        org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker: WARN
        org.ehcache.jsr107.Eh107CacheManager: WARN
        org.hibernate.engine.internal.StatefulPersistenceContext: ERROR
        # Set to DEBUG to show hibernate sql request
        org.hibernate.SQL: OFF
        # To show values in hibernate requests set to DEBUG
        org.hibernate.type: OFF
        # Elasticsearch
        org.elasticsearch: WARN
        # To show http trafic set to DEBUG
        org.apache.http.wire: OFF
        org.apache.http.impl.client: OFF

    warnDuration: 1500
    file:
        text:
            enable: true
            name: ${base-path}/logs/numahop
            pattern: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%ex'
            rolling:
                enable: true
                pattern: '%d{yyyy-MM-dd}'
                delete-older-than: 90 # In days

        json:
            enable: false
            name: ${base-path}/logs/json/numahop
            rolling:
                enable: true
                pattern: '%d{yyyy-MM-dd}'
                delete-older-than: 90 # In days

    console:
        mode: text # one of 'text' or 'json'
        pattern: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%ex'

management:
    endpoints:
        web.exposure.include: '*'
        web.path-mapping.metrics: sb-metrics
    endpoint:
        health:
            show-details: always
            mail.enabled: false
        logfile.external-file: ${logging.file.text.name}.log
    info.env.enabled: true
    server:
        add-application-context-header: true # Add the "X-Application-Context" HTTP header in each response.

server:
    port: 8080
    servlet.session.timeout: 10800 # 3 heures
    shutdown: graceful
    compression:
        enabled: true

spring:
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:mariadb://localhost:3306/pgcn?cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&characterEncoding=utf8&useUnicode=true
        username:
        password:
        hikari:
            auto-commit: false
            minimum-idle: 5
            maximum-pool-size: 50
            leak-detection-threshold: 600000

    liquibase.change-log: classpath:/config/liquibase/master.xml

    elasticsearch:
        uris:
            - http://localhost:9200
        connection-timeout: 120s
        socket-timeout: 120s

    jackson:
        serialization:
            use-equality-for-object-id: true
            write-dates-as-timestamps: false
            write-empty-json-arrays: true

    jpa:
        database: MYSQL
        show-sql: false
        open-in-view: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        properties:
            hibernate:
                connection.provider_disables_autocommit: true
                generate_statistics: false
                default_batch_fetch_size: 64
                order_inserts: false
                order_updates: false
                query:
                    in_clause_parameter_padding: true
                jdbc:
                    batch_size: 64
                    fetch_size: 384
                    batch_versioned_data: true
                    batch_fetch_style: dynamic
                cache:
                    use_second_level_cache: true
                    use_query_cache: false

    mail:
        host: localhost
        port: 25
        user:
        password:
        protocol: smtp
        tls: false
        auth: false
        activated: false
        from: contact-numahop@numahop.fr

    output.ansi.enabled: always

    # Gestion des upload (taille max)
    servlet:
        multipart:
            file-size-threshold: 10MB
            maxFileSize: 100MB
            maxRequestSize: 200MB
